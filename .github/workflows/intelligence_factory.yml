name: Mentora Intelligence Factory

on:
  schedule:
    - cron: '0 * * * *'  # Runs automatically every hour on the hour
  workflow_dispatch:

concurrency:
  group: mentora-intelligence-factory-ledger
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
      GOOGLE_OAUTH_CLIENT_SECRETS: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRETS }}
      GOOGLE_DRIVE_TOKEN_PATH: token.json
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
      OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
      OPENROUTER_API_2: ${{ secrets.OPENROUTER_API_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[cloud,vision,verify,test]'
      - run: pytest -q
      - name: Authenticate Google Drive Token
        env:
          DRIVE_TOKEN_CONTENT: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: |
          if [ -n "$DRIVE_TOKEN_CONTENT" ]; then
            printf '%s' "$DRIVE_TOKEN_CONTENT" > token.json
            chmod 600 token.json
            echo "Successfully wrote token.json from GitHub Secret."
          else
            echo "::error::GOOGLE_DRIVE_TOKEN_JSON secret is empty."
            exit 1
          fi
      - name: Run Autonomous Pipeline Batches
        run: |
          # Loop to run multiple batches back-to-back within the runner time limit
          for i in {1..3}; do
            echo "Starting autonomous batch $i..."
            python -m src.pipeline --max-pages 50 --time-budget-seconds 600 || break
          done
      - name: Commit status & Ledger
        run: |
          git config user.name "mentora-factory[bot]"
          git config user.email "mentora-factory[bot]@users.noreply.github.com"
          git add STATUS.md data/ledger.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: update intelligence factory status & ledger [skip ci]"
          git push
name: Mentora Intelligence Factory

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: mentora-intelligence-factory-ledger
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # Bounded execution limit per cloud marathon
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO: ${{ secrets.HF_DATASET_REPO }}
      GOOGLE_DRIVE_TOKEN_JSON: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
      GOOGLE_OAUTH_CLIENT_SECRETS: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRETS }}
      GOOGLE_DRIVE_TOKEN_PATH: token.json
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_USERNAME_1: ${{ secrets.KAGGLE_USERNAME_1 }}
      KAGGLE_KEY_1: ${{ secrets.KAGGLE_KEY_1 }}
      KAGGLE_USERNAME_2: ${{ secrets.KAGGLE_USERNAME_2 }}
      KAGGLE_KEY_2: ${{ secrets.KAGGLE_KEY_2 }}
      KAGGLE_USERNAME_3: ${{ secrets.KAGGLE_USERNAME_3 }}
      KAGGLE_KEY_3: ${{ secrets.KAGGLE_KEY_3 }}
      KAGGLE_USERNAME_4: ${{ secrets.KAGGLE_USERNAME_4 }}
      KAGGLE_KEY_4: ${{ secrets.KAGGLE_KEY_4 }}
      KAGGLE_USERNAME_5: ${{ secrets.KAGGLE_USERNAME_5 }}
      KAGGLE_KEY_5: ${{ secrets.KAGGLE_KEY_5 }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
      GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
      GROQ_API_KEY_5: ${{ secrets.GROQ_API_KEY_5 }}
      OPENROUTER_API_KEY_1: ${{ secrets.OPENROUTER_API_KEY_1 }}
      OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
      OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
      OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
      OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
      ENABLE_LOCAL_OLLAMA: "0"
      AUTO_SKIP_DISCOVERY_IF_POPULATED: "1"
      CONTINUOUS_HF_CHECKPOINT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[cloud,vision,verify,test]'
      - run: pytest -q
      - name: Authenticate Google Drive Token
        env:
          DRIVE_TOKEN_CONTENT: ${{ secrets.GOOGLE_DRIVE_TOKEN_JSON }}
        run: |
          if [ -n "$DRIVE_TOKEN_CONTENT" ]; then
            printf '%s' "$DRIVE_TOKEN_CONTENT" > token.json
            chmod 600 token.json
            echo "Successfully wrote token.json from GitHub Secret."
          else
            echo "::error::GOOGLE_DRIVE_TOKEN_JSON secret is empty."
            exit 1
          fi

      - name: Dispatch Live Kaggle GPU Fleet
        run: |
          python -c "from src.cloud.kaggle import KaggleDispatcher; from pathlib import Path; KaggleDispatcher(Path('.')).dispatch_fleet({})" || true

      - name: Sync Durable State from Hugging Face Vault
        run: |
          python -c "
          import os
          from pathlib import Path
          from huggingface_hub import hf_hub_download

          token = os.environ.get('HF_TOKEN')
          repo = os.environ.get('HF_DATASET_REPO')
          if token and repo:
              for f in ['state/corpus_ledger.json', 'state/question_ledger.json', 'state/batch_history.json']:
                  try:
                      downloaded = hf_hub_download(repo_id=repo, filename=f, repo_type='dataset', token=token)
                      dest = Path(f)
                      dest.parent.mkdir(parents=True, exist_ok=True)
                      dest.write_bytes(Path(downloaded).read_bytes())
                      print(f'Successfully synced {f} from Hugging Face Vault.')
                  except Exception as exc:
                      print(f'Using local fallback for {f} (note: {exc})')
          " || true

      - name: Snapshot Initial Progress Metrics
        run: python scripts/assert_forward_progress.py --snapshot || true

      - name: Run Bounded Autonomous Marathon (5 Batches / ~30 Mins)
        run: |
          git config user.name "mentora-factory[bot]"
          git config user.email "mentora-factory[bot]@users.noreply.github.com"

          # Harvest any completed Kaggle outputs before batch processing
          python scripts/harvest_kaggle_outputs.py || true

          for i in {1..5}; do
            echo "=== Starting Autonomous Batch $i of 5 ==="
            python -m src.pipeline --max-pages 15 --time-budget-seconds 300 || true

            # Harvest any newly completed Kaggle artifacts
            python scripts/harvest_kaggle_outputs.py || true

            # Sync reports deterministically
            python scripts/generate_operational_reports.py || true

            # Stage only verified reports, ledgers, and packages; verify no secret files staged
            git add STATUS.md AUTONOMOUS_EXECUTION_STATUS.md AUTONOMOUS_FINAL_REPORT.md SHUTDOWN_READINESS.md state/corpus_ledger.json state/question_ledger.json state/batch_history.json intelligence/packages/ 2>/dev/null || true

            # Ensure zero secret/token files are accidentally staged
            for staged_f in $(git diff --cached --name-only); do
              case "$staged_f" in
                *secret*|*token*|*credential*|*.env*|*key*|*spill*)
                  echo "WARNING: Unstaging sensitive artifact: $staged_f"
                  git reset HEAD "$staged_f" || true
                  ;;
              esac
            done

            if ! git diff --cached --quiet; then
              git commit -m "feat(factory): cloud autonomous batch marathon progression (batch $i) [skip ci]" || true

              # Safely preserve any unstaged tracked changes so rebase never fails
              STASHED=0
              if ! git diff --quiet; then
                git stash push -m "runner-workdir-preservation" && STASHED=1 || true
              fi

              for retry in {1..5}; do
                if git pull --rebase origin main && git push origin HEAD:main; then
                  echo "Successfully pushed batch $i telemetry commit."
                  break
                else
                  echo "Rebase/push retry $retry failed; waiting before retry..."
                  sleep 5
                fi
              done

              if [ "$STASHED" -eq 1 ]; then
                git stash pop || true
              fi
            fi
          done

      - name: Enforce Forward Progress (Ban Fake-Green CI)
        run: python scripts/assert_forward_progress.py --assert

      - name: Trigger next autonomous marathon immediately
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Marathon complete with positive forward progress. Triggering next autonomous run..."
          sleep 10
          gh workflow run intelligence_factory.yml --ref main || true
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mentora-teaching-intelligence"
version = "0.1.0"
description = "Governed, resumable teaching-intelligence factory"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
cloud = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.2", "huggingface_hub>=0.24", "kaggle>=1.6", "pyyaml>=6.0"]
vision = ["PyMuPDF>=1.24", "Pillow>=10.0"]
verify = ["sympy>=1.13", "rdkit>=2024.3"]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["src*"]
